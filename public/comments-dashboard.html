<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday - Gestion des Commentaires</title>
  <link rel="stylesheet" href="friday-theme.css">
  <style>
    .filters-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .filters-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      align-items: end;
    }

    .filter-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .comment-item {
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 15px;
      transition: all 0.3s;
      background: var(--bg-card);
    }

    .comment-item:hover {
      border-color: var(--primary-orange);
      box-shadow: 0 3px 10px rgba(255, 107, 53, 0.2);
    }

    .comment-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      flex-wrap: wrap;
      gap: 10px;
    }

    .comment-meta {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .platform-badge {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    .platform-badge.instagram {
      background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
      color: white;
    }

    .platform-badge.facebook {
      background: #1877f2;
      color: white;
    }

    .comment-date {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .comment-id {
      color: var(--text-secondary);
      font-size: 0.85rem;
      font-family: 'Courier New', monospace;
    }

    .comment-content {
      background: var(--bg-dark-lighter);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
    }

    .comment-label {
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 8px;
      font-size: 0.9rem;
    }

    .comment-text {
      color: var(--text-secondary);
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .reply-content {
      background: rgba(255, 107, 53, 0.1);
      padding: 15px;
      border-radius: 8px;
      border-left: 4px solid var(--primary-orange);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      margin-top: 30px;
    }

    .pagination-btn {
      padding: 8px 16px;
      border: 2px solid var(--primary-orange);
      background: transparent;
      color: var(--primary-orange);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .pagination-btn:hover:not(:disabled) {
      background: var(--primary-orange);
      color: white;
    }

    .pagination-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .pagination-info {
      color: var(--text-primary);
      font-weight: 500;
    }

    .loading {
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .loading-spinner {
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--primary-orange);
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @media (max-width: 768px) {
      .filters-row {
        grid-template-columns: 1fr;
      }

      .comment-header {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">F</div>
          <div class="logo-text">Friday</div>
        </div>
        <p class="sidebar-subtitle">Agent IA Marketing</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-title">Navigation</p>
        <ul class="nav-items">
          <li class="nav-item">
            <a href="/" class="nav-link">
              <span class="nav-icon">🏠</span>
              <span>Accueil</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/agent-config.html" class="nav-link">
              <span class="nav-icon">🤖</span>
              <span>Agent IA</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/publisher.html" class="nav-link">
              <span class="nav-icon">📤</span>
              <span>Publier</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/comments-dashboard.html" class="nav-link active">
              <span class="nav-icon">💬</span>
              <span>Commentaires</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div class="top-bar-left">
          <h1 class="page-title">💬 Gestion des Commentaires</h1>
        </div>
      </div>

      <div class="content-area">
        <!-- Statistiques -->
        <div class="stats-grid" id="statsGrid">
          <div class="stat-card">
            <div class="stat-value" id="totalStat">-</div>
            <div class="stat-label">Total Commentaires</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="instagramStat">-</div>
            <div class="stat-label">Instagram</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="facebookStat">-</div>
            <div class="stat-label">Facebook</div>
          </div>
          <div class="stat-card">
            <div class="stat-value" id="last24hStat">-</div>
            <div class="stat-label">Dernières 24h</div>
          </div>
        </div>

        <!-- Filtres -->
        <div class="filters-card">
          <div class="filters-row">
            <div class="filter-group">
              <label for="platformFilter" class="form-label">Plateforme</label>
              <select id="platformFilter" class="form-select">
                <option value="">Toutes</option>
                <option value="instagram">Instagram</option>
                <option value="facebook">Facebook</option>
              </select>
            </div>
            <div class="filter-group">
              <label for="accountFilter" class="form-label">Compte</label>
              <select id="accountFilter" class="form-select">
                <option value="">Tous les comptes</option>
              </select>
            </div>
            <div class="filter-group">
              <button class="btn btn-primary" onclick="applyFilters()">Appliquer</button>
            </div>
          </div>
        </div>

        <!-- Liste des commentaires -->
        <div class="card">
          <h2 class="card-title">Historique des réponses</h2>
          <div id="commentsList">
            <div class="loading">
              <div class="loading-spinner"></div>
              <div>Chargement des commentaires...</div>
            </div>
          </div>

          <!-- Pagination -->
          <div class="pagination" id="pagination" style="display: none;">
            <button class="pagination-btn" id="prevBtn" onclick="previousPage()">← Précédent</button>
            <div class="pagination-info" id="paginationInfo">-</div>
            <button class="pagination-btn" id="nextBtn" onclick="nextPage()">Suivant →</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="comments-dashboard.js"></script>
</body>
</html>
