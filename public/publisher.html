<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friday - Publier du contenu</title>
  <link rel="stylesheet" href="friday-theme.css">
  <style>
    .upload-zone {
      border: 3px dashed var(--border-color);
      border-radius: 8px;
      padding: 40px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: var(--bg-card);
    }

    .upload-zone:hover {
      border-color: var(--primary-orange);
      background: rgba(255, 107, 53, 0.05);
    }

    .upload-zone input[type="file"] {
      display: none;
    }

    .upload-icon {
      font-size: 3rem;
      margin-bottom: 10px;
    }

    .upload-preview {
      margin-top: 15px;
      max-width: 100%;
    }

    .upload-preview img,
    .upload-preview video {
      max-width: 100%;
      max-height: 300px;
      border-radius: 8px;
    }

    .scheduled-item {
      background: var(--bg-card);
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary-orange);
    }

    .scheduled-item .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .status.pending {
      background: #ffc107;
      color: #000;
    }

    .status.published {
      background: var(--success-green);
      color: white;
    }

    .status.failed {
      background: var(--error-red);
      color: white;
    }

    .scheduled-item-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .scheduled-item-type {
      font-weight: 600;
      color: var(--primary-orange);
      text-transform: uppercase;
      font-size: 0.85rem;
    }

    .scheduled-item-time {
      color: var(--text-secondary);
      font-size: 0.9rem;
    }

    .scheduled-item-caption {
      color: var(--text-primary);
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .delete-btn {
      background: var(--error-red);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .delete-btn:hover {
      opacity: 0.8;
    }

    .alert {
      padding: 15px 20px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-weight: 500;
    }

    .alert-success {
      background: rgba(76, 175, 80, 0.2);
      color: var(--success-green);
      border: 1px solid var(--success-green);
    }

    .alert-error {
      background: rgba(244, 67, 54, 0.2);
      color: var(--error-red);
      border: 1px solid var(--error-red);
    }

    .loading {
      opacity: 0.6;
      pointer-events: none;
    }

    #scheduleTimeGroup {
      display: none;
    }

    .content-grid {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    @media (max-width: 968px) {
      .content-grid {
        grid-template-columns: 1fr;
      }
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 25px;
    }

    .scheduled-list {
      max-height: 500px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="app-container">
    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">F</div>
          <div class="logo-text">Friday</div>
        </div>
        <p class="sidebar-subtitle">Agent IA Marketing</p>
      </div>

      <nav class="sidebar-nav">
        <p class="nav-section-title">Navigation</p>
        <ul class="nav-items">
          <li class="nav-item">
            <a href="/" class="nav-link">
              <span class="nav-icon">🏠</span>
              <span>Accueil</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/agent-config.html" class="nav-link">
              <span class="nav-icon">🤖</span>
              <span>Agent IA</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/publisher.html" class="nav-link active">
              <span class="nav-icon">📤</span>
              <span>Publier</span>
            </a>
          </li>
          <li class="nav-item">
            <a href="/comments-dashboard.html" class="nav-link">
              <span class="nav-icon">💬</span>
              <span>Commentaires</span>
            </a>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Main Content -->
    <main class="main-content">
      <div class="top-bar">
        <div class="top-bar-left">
          <h1 class="page-title">📤 Publier du contenu</h1>
        </div>
      </div>

      <div class="content-area">
        <div id="alertContainer"></div>

        <div class="content-grid">
          <!-- Formulaire de publication -->
          <div class="card">
            <h2 class="card-title">Créer une publication</h2>

            <form id="publishForm">
              <!-- Sélection du compte -->
              <div class="form-group">
                <label for="account" class="form-label">Compte</label>
                <select id="account" class="form-select" required>
                  <option value="">Sélectionnez un compte...</option>
                </select>
              </div>

              <!-- Type de contenu -->
              <div class="form-group">
                <label for="contentType" class="form-label">Type de contenu</label>
                <select id="contentType" class="form-select" required>
                  <option value="">Sélectionnez un type...</option>
                  <option value="post">Post</option>
                  <option value="story">Story</option>
                  <option value="reel">Reel</option>
                </select>
              </div>

              <!-- Upload de fichier -->
              <div class="form-group">
                <label class="form-label">Média (Image ou Vidéo)</label>
                <div class="upload-zone" id="uploadZone">
                  <input type="file" id="fileInput" accept="image/*,video/*">
                  <div class="upload-icon">📁</div>
                  <div style="color: var(--text-primary);">Cliquez ou glissez un fichier ici</div>
                  <div style="font-size: 0.9rem; color: var(--text-secondary); margin-top: 10px;">JPG, PNG, MP4 (max 100MB)</div>
                  <div id="uploadPreview" class="upload-preview"></div>
                </div>
              </div>

              <!-- Caption -->
              <div class="form-group">
                <label for="caption" class="form-label">Caption / Description</label>
                <textarea id="caption" class="form-textarea" placeholder="Écrivez votre message..."></textarea>
              </div>

              <!-- Mode de publication -->
              <div class="form-group">
                <label for="publishMode" class="form-label">Mode de publication</label>
                <select id="publishMode" class="form-select" required>
                  <option value="now">Publier maintenant</option>
                  <option value="schedule">Programmer</option>
                </select>
              </div>

              <!-- Date/Heure (si programmé) -->
              <div class="form-group" id="scheduleTimeGroup">
                <label for="scheduleTime" class="form-label">Date et heure de publication</label>
                <input type="datetime-local" id="scheduleTime" class="form-input">
              </div>

              <!-- Boutons -->
              <div class="button-group">
                <button type="submit" class="btn btn-primary">
                  <span id="submitText">Publier</span>
                </button>
                <button type="button" class="btn btn-secondary" onclick="resetForm()">
                  Réinitialiser
                </button>
              </div>
            </form>
          </div>

          <!-- Liste du contenu programmé -->
          <div class="card">
            <h2 class="card-title">Contenu programmé</h2>
            <div id="scheduledList" class="scheduled-list">
              <div class="empty-state">
                <div class="empty-state-icon">📅</div>
                <div class="empty-state-text">Aucun contenu programmé</div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="publisher.js"></script>
</body>
</html>
