<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Réussie - Agent IA</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="success-animation">
                <div class="checkmark">✓</div>
            </div>

            <div class="header">
                <h1>🎉 Connexion Réussie !</h1>
                <p class="subtitle">Votre compte Meta a été connecté avec succès à l'agent IA</p>
            </div>

            <div id="user-details" class="user-details">
                <h3>Informations du compte</h3>
                <div id="details-content" class="details-content">
                    <p>Chargement...</p>
                </div>
            </div>

            <div class="actions">
                <button onclick="window.location.href='/agent-config.html'" class="primary-btn" style="background: #667eea;">⚙️ Configurer l'Agent IA</button>
                <button onclick="window.location.href='/debug'" class="secondary-btn" style="background: #f59e0b;">🐛 Voir les détails de debug</button>
                <button onclick="window.location.href='/'" class="secondary-btn">Retour à l'accueil</button>
                <button id="revoke-btn" class="danger-btn">Révoquer l'accès</button>
            </div>
        </div>

        <div class="footer">
            <p>L'agent IA peut maintenant gérer vos publicités et contenus</p>
        </div>
    </div>

    <script>
        // Charger les détails de l'utilisateur
        async function loadUserDetails() {
            try {
                const response = await fetch('/api/user', {
                    credentials: 'include'
                });

                if (!response.ok) {
                    throw new Error('Erreur lors du chargement des détails');
                }

                const user = await response.json();
                displayUserDetails(user);
            } catch (error) {
                console.error('Erreur:', error);
                document.getElementById('details-content').innerHTML =
                    '<p class="error">Erreur lors du chargement des détails</p>';
            }
        }

        function displayUserDetails(user) {
            const detailsHTML = `
                <div class="detail-item">
                    <strong>Nom:</strong> ${user.name}
                </div>
                <div class="detail-item">
                    <strong>Email:</strong> ${user.email || 'Non fourni'}
                </div>
                <div class="detail-item">
                    <strong>Facebook ID:</strong> ${user.facebook_id}
                </div>
                <div class="detail-item">
                    <strong>Token expire le:</strong> ${new Date(user.expires_at).toLocaleString('fr-FR')}
                </div>
                <div class="detail-item">
                    <strong>Pages connectées:</strong> ${user.pages.length}
                    ${user.pages.length > 0 ? `
                        <ul class="sub-list">
                            ${user.pages.map(page => `<li>${page.name} (ID: ${page.id})</li>`).join('')}
                        </ul>
                    ` : ''}
                </div>
                <div class="detail-item">
                    <strong>Comptes publicitaires:</strong> ${user.ad_accounts.length}
                    ${user.ad_accounts.length > 0 ? `
                        <ul class="sub-list">
                            ${user.ad_accounts.map(acc => `<li>${acc.name || acc.account_id}</li>`).join('')}
                        </ul>
                    ` : ''}
                </div>
                <div class="detail-item">
                    <strong>Permissions accordées:</strong>
                    <ul class="permissions-granted">
                        ${user.permissions.map(perm => `<li>✓ ${perm}</li>`).join('')}
                    </ul>
                </div>
            `;

            document.getElementById('details-content').innerHTML = detailsHTML;
        }

        // Révoquer l'accès
        document.getElementById('revoke-btn').addEventListener('click', async () => {
            if (!confirm('Êtes-vous sûr de vouloir révoquer l\'accès de l\'agent IA ?')) {
                return;
            }

            try {
                const response = await fetch('/api/revoke', {
                    method: 'POST',
                    credentials: 'include'
                });

                if (response.ok) {
                    alert('Accès révoqué avec succès');
                    window.location.href = '/';
                } else {
                    alert('Erreur lors de la révocation de l\'accès');
                }
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de la révocation de l\'accès');
            }
        });

        // Charger les détails au chargement de la page
        loadUserDetails();
    </script>
</body>
</html>
