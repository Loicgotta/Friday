# Render Blueprint - Friday AI Agent
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: friday-drive-rag
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/status
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: BASE_URL
        fromService:
          type: web
          name: friday-drive-rag
          property: host
      - key: CALLBACK_URL
        value: https://${BASE_URL}/auth/google/callback
